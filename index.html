<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Idle Mining Game</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell,
          sans-serif;
        background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        color: #333;
        min-height: 100vh;
        padding: 20px;
      }

      #app {
        max-width: 600px;
        margin: 0 auto;
        background: white;
        border-radius: 12px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        height: 100vh;
        max-height: 100vh;
      }

      .header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 20px;
        text-align: center;
      }

      .header h1 {
        font-size: 28px;
        margin-bottom: 8px;
      }

      .resources-panel {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        padding: 16px;
        background: #f8f9fa;
        border-bottom: 1px solid #e0e0e0;
      }

      .resource-item {
        background: white;
        padding: 12px;
        border-radius: 8px;
        text-align: center;
        border: 1px solid #e0e0e0;
      }

      .resource-label {
        font-size: 12px;
        color: #666;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 4px;
      }

      .resource-value {
        font-size: 20px;
        font-weight: bold;
        color: #667eea;
      }

      .content {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
      }

      .mining-panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }

      .mining-stats {
        width: 100%;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .stat-box {
        background: #f0f4ff;
        padding: 12px;
        border-radius: 8px;
        text-align: center;
        border: 1px solid #d0d8ff;
      }

      .stat-label {
        font-size: 12px;
        color: #666;
        margin-bottom: 4px;
      }

      .stat-value {
        font-size: 18px;
        font-weight: bold;
        color: #667eea;
      }

      .ore-deposit {
        width: 100%;
        max-width: 300px;
        aspect-ratio: 1;
        background: linear-gradient(135deg, #ff9a56 0%, #ff6b35 100%);
        border-radius: 12px;
        border: 3px solid #ff5722;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        user-select: none;
        transition: transform 0.1s, box-shadow 0.1s;
        box-shadow: 0 10px 30px rgba(255, 107, 53, 0.3);
      }

      .ore-deposit:active {
        transform: scale(0.95);
        box-shadow: 0 5px 15px rgba(255, 107, 53, 0.2);
      }

      .ore-deposit-text {
        text-align: center;
        color: white;
      }

      .ore-deposit-label {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 8px;
      }

      .ore-deposit-amount {
        font-size: 28px;
        font-weight: bold;
      }

      .auto-unlock-info {
        width: 100%;
        background: #e8f5e9;
        border: 2px solid #4caf50;
        border-radius: 8px;
        padding: 12px;
        text-align: center;
        font-size: 14px;
        color: #2e7d32;
      }

      .auto-unlock-info.unlocked {
        background: #fff3e0;
        border-color: #ff9800;
        color: #e65100;
      }

      .tab-navigation {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
        border-bottom: 2px solid #e0e0e0;
      }

      .tab-button {
        flex: 1;
        padding: 12px;
        border: none;
        background: transparent;
        font-size: 14px;
        font-weight: 600;
        color: #999;
        cursor: pointer;
        border-bottom: 3px solid transparent;
        transition: all 0.2s;
      }

      .tab-button.active {
        color: #667eea;
        border-bottom-color: #667eea;
      }

      .tab-button:hover:not(.active) {
        color: #666;
      }

      .tab-content {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .smelting-panel {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .smelting-info {
        background: #f0f4ff;
        padding: 12px;
        border-radius: 8px;
        text-align: center;
      }

      .ore-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .ore-smelting-item {
        background: #f9f9f9;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid #e0e0e0;
      }

      .ore-name {
        font-weight: bold;
        margin-bottom: 8px;
        color: #333;
      }

      .ore-stats {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 8px;
        margin-bottom: 8px;
        font-size: 12px;
        color: #666;
      }

      .progress-bar {
        width: 100%;
        height: 6px;
        background: #e0e0e0;
        border-radius: 3px;
        overflow: hidden;
        margin-bottom: 8px;
      }

      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
        transition: width 0.1s;
      }

      .ore-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .queue-button {
        padding: 8px;
        background: #667eea;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 12px;
        cursor: pointer;
        transition: background 0.2s;
      }

      .queue-button:hover {
        background: #764ba2;
      }

      .queue-button:active {
        transform: scale(0.98);
      }

      .crafting-panel {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .crafting-section {
        background: #f9f9f9;
        padding: 16px;
        border-radius: 8px;
        border: 1px solid #e0e0e0;
      }

      .crafting-section h3 {
        margin-bottom: 12px;
        color: #333;
      }

      .craft-buttons {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .craft-button {
        padding: 12px;
        background: #667eea;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }

      .craft-button:hover:not(.disabled) {
        background: #764ba2;
      }

      .craft-button.disabled,
      .craft-button:disabled {
        background: #ccc;
        cursor: not-allowed;
      }

      .craft-button:active:not(.disabled) {
        transform: scale(0.98);
      }

      .sell-button {
        padding: 12px;
        background: #4caf50;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }

      .sell-button:hover:not(:disabled) {
        background: #45a049;
      }

      .sell-button:disabled {
        background: #ccc;
        cursor: not-allowed;
      }

      .sell-button:active:not(:disabled) {
        transform: scale(0.98);
      }

      .tool-value,
      .tools-available {
        font-size: 14px;
        margin-bottom: 8px;
        color: #666;
      }

      .upgrades-panel {
        display: flex;
        flex-direction: column;
      }

      .upgrades-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .upgrade-card {
        background: linear-gradient(135deg, #f9f9f9 0%, #f5f5f5 100%);
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .upgrade-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .upgrade-name {
        font-weight: bold;
        color: #333;
        font-size: 16px;
      }

      .upgrade-level {
        font-size: 12px;
        color: #999;
        background: #e8e8e8;
        padding: 4px 8px;
        border-radius: 4px;
      }

      .upgrade-description {
        font-size: 12px;
        color: #666;
        line-height: 1.4;
      }

      .upgrade-cost {
        font-size: 13px;
        color: #333;
        display: flex;
        justify-content: space-between;
      }

      .current-coins {
        color: #667eea;
        font-weight: 600;
      }

      .buy-button {
        padding: 10px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        font-size: 14px;
      }

      .buy-button:hover:not(.disabled) {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
      }

      .buy-button:active:not(.disabled) {
        transform: translateY(0);
      }

      .buy-button.disabled,
      .buy-button:disabled {
        background: #ccc;
        cursor: not-allowed;
        opacity: 0.6;
      }

      .stats-panel {
        display: flex;
        flex-direction: column;
      }

      .stats-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .stat-card {
        background: linear-gradient(135deg, #f9f9f9 0%, #f5f5f5 100%);
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        padding: 16px;
        text-align: center;
      }

      .stat-card-label {
        font-size: 12px;
        color: #999;
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .stat-card-value {
        font-size: 20px;
        font-weight: bold;
        color: #667eea;
      }

      .prestige-panel {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 300px;
      }

      .prestige-card {
        background: linear-gradient(135deg, #fff9e6 0%, #ffe680 100%);
        border: 3px solid #ffc107;
        border-radius: 12px;
        padding: 24px;
        text-align: center;
        max-width: 400px;
      }

      .prestige-card h3 {
        font-size: 24px;
        color: #ff6f00;
        margin-bottom: 20px;
      }

      .prestige-info {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 12px;
        margin-bottom: 20px;
      }

      .prestige-stat {
        background: rgba(255, 255, 255, 0.8);
        padding: 12px;
        border-radius: 8px;
      }

      .prestige-label {
        font-size: 11px;
        color: #999;
        margin-bottom: 4px;
        text-transform: uppercase;
      }

      .prestige-value {
        font-size: 18px;
        font-weight: bold;
        color: #ff6f00;
      }

      .prestige-gain {
        font-size: 24px;
        color: #4caf50;
      }

      .prestige-requirement {
        background: rgba(255, 255, 255, 0.6);
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 16px;
        font-size: 13px;
        color: #333;
      }

      .prestige-button {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #ff6f00 0%, #ff9100 100%);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        margin-bottom: 16px;
        transition: all 0.2s;
      }

      .prestige-button:hover:not(.disabled) {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(255, 111, 0, 0.4);
      }

      .prestige-button:active:not(.disabled) {
        transform: translateY(0);
      }

      .prestige-button.disabled,
      .prestige-button:disabled {
        background: #ccc;
        cursor: not-allowed;
        opacity: 0.6;
      }

      .prestige-effect {
        font-size: 12px;
        color: #333;
        line-height: 1.5;
        background: rgba(255, 255, 255, 0.5);
        padding: 12px;
        border-radius: 6px;
      }

      .event-notification-area {
        margin-bottom: 12px;
      }

      .event-notification {
        padding: 12px;
        border-left: 4px solid;
        border-radius: 4px;
        background: #e3f2fd;
        animation: slideIn 0.3s ease-out;
      }

      @keyframes slideIn {
        from {
          transform: translateY(-10px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      .event-text {
        font-weight: 600;
        font-size: 14px;
        text-align: center;
      }

      .automation-panel {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .automation-grid {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .automation-item {
        background: #f9f9f9;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid #e0e0e0;
      }

      .automation-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
      }

      .automation-name {
        font-weight: 600;
        color: #333;
      }

      .toggle-button {
        padding: 6px 12px;
        background: #e0e0e0;
        color: #666;
        border: none;
        border-radius: 4px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
      }

      .toggle-button.active {
        background: #4caf50;
        color: white;
      }

      .automation-desc {
        font-size: 12px;
        color: #999;
      }

      .workers-panel {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .workers-header {
        background: #f9f9f9;
        padding: 12px;
        border-radius: 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .workers-header h3 {
        margin: 0;
        font-size: 16px;
      }

      .workers-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .worker-card {
        background: linear-gradient(135deg, #f0f4ff 0%, #f5f0ff 100%);
        border: 1px solid #d8d8ff;
        border-radius: 8px;
        padding: 12px;
      }

      .worker-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
      }

      .worker-name {
        font-weight: 600;
        color: #333;
      }

      .worker-count {
        background: #667eea;
        color: white;
        padding: 2px 8px;
        border-radius: 12px;
        font-size: 12px;
        font-weight: 600;
      }

      .worker-desc {
        font-size: 12px;
        color: #666;
        margin-bottom: 8px;
      }

      .worker-morale {
        margin-bottom: 8px;
      }

      .morale-bar {
        height: 4px;
        background: #e0e0e0;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 4px;
      }

      .morale-fill {
        height: 100%;
        background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
      }

      .morale-text {
        font-size: 10px;
        color: #999;
      }

      .worker-cost {
        font-size: 12px;
        color: #667eea;
        font-weight: 600;
        margin-bottom: 8px;
      }

      .hire-button {
        width: 100%;
        padding: 8px;
        background: #667eea;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
      }

      .hire-button:hover:not(.disabled) {
        background: #764ba2;
      }

      .hire-button:active:not(.disabled) {
        transform: scale(0.98);
      }

      .hire-button.disabled,
      .hire-button:disabled {
        background: #ccc;
        cursor: not-allowed;
        opacity: 0.6;
      }

      @media (max-width: 480px) {
        .header h1 {
          font-size: 24px;
        }

        .resources-panel {
          grid-template-columns: 1fr 1fr;
          gap: 8px;
          padding: 12px;
        }

        .resource-value {
          font-size: 18px;
        }

        .content {
          padding: 16px;
        }

        .tab-button {
          font-size: 12px;
          padding: 10px;
        }

        .ore-stats {
          grid-template-columns: 1fr 1fr 1fr;
          font-size: 11px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="header">
        <h1>⛏️ Idle Mining</h1>
      </div>
      <div id="resources-container" class="resources-panel"></div>
      <div class="content">
        <div id="content-container"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
